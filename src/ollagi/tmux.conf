# tmux settings for ollagi sessions only (passed with -f; my own ~/.tmux.conf is not touched).
# Goal: a session attached in a terminal looks and feels like plain `claude`.

# No status bar: the window looks like an ordinary terminal.
set -g status off
# tmux waits 500 ms after Esc to see whether a key sequence follows. Claude Code uses Esc to
# interrupt and to close menus, so make it react at once.
set -g escape-time 10
# Claude Code uses Ctrl-b itself (run a task in the background), and Ctrl-b is tmux's default
# command key. Move tmux's to Ctrl-] so Ctrl-b reaches Claude. Detach with Ctrl-] then d.
set -g prefix C-]
unbind C-b
bind C-] send-prefix
# Plenty of scrollback for the page to read, colours as the terminal has them, mouse scrolling.
set -g history-limit 50000
set -g default-terminal "tmux-256color"
# The browser's live terminal (xterm.js, TERM xterm-256color) understands synchronized updates
# (DEC mode 2026): a frame marked that way is shown whole. Claude Code marks every redraw, and
# tmux only passes the marks on to a terminal listed as supporting them. Without "sync" the
# phone gets each redraw in pieces and the screen jitters (docs/decisions/0026).
set -as terminal-features ",foot*:RGB,xterm-256color:RGB:sync"
set -g mouse on
# When several terminals look at the same session, size it to the one most recently used.
set -g window-size latest
